name: Claude Code

# Interactive @claude runs. Ed (shapedthought) is the only one who can trigger them.
# Writer rules: .github/claude/WRITER.md

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]  # 'assigned' dropped: it needs assignee_trigger and could never start Claude

# One run at a time per issue/PR (each works on its own claude/ branch), so runs on
# different issues no longer cancel each other's pending runs. A new trigger waits
# for the running job instead of cancelling it. GitHub keeps only one PENDING run
# per group, so a newer comment on the same issue/PR replaces a pending one.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

# Nothing is granted by default; the job declares exactly what it needs.
permissions: {}

jobs:
  claude:
    # Both the actor AND the author of the issue/PR must be shapedthought, so that
    # text written by anyone else (title/body are always passed to Claude) can't reach
    # a write-capable agent. For issue_comment on a PR, github.event.issue is the PR.
    if: |
      github.actor == 'shapedthought' && (
        (github.event_name == 'issue_comment' &&
          github.event.issue.user.login == 'shapedthought' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.pull_request.user.login == 'shapedthought' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          github.event.pull_request.user.login == 'shapedthought' &&
          contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          github.event.issue.user.login == 'shapedthought' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # push commits to claude/* branches
      pull-requests: write  # comment on and update PRs
      issues: write         # comment on issues
      id-token: write       # OIDC exchange for the Claude GitHub App token
      actions: write        # read CI results/logs, and dispatch ci.yml after Claude pushes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only Ed's comments (and Claude's own progress comments) go into Claude's context,
          # so text from other users can't steer the writer.
          include_comments_by_actor: "shapedthought,claude[bot]"
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 80
            --append-system-prompt "Before doing anything, read .github/claude/WRITER.md and follow it. Never read or implement from planning/."
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS,Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(gofmt:*),Bash(go list:*),Bash(go doc:*),Bash(go env:*),Bash(go mod tidy:*),Bash(go mod download:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(git push:*),Bash(git fetch:*),Bash(git merge:*),Bash(git merge-base:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --disallowedTools "WebFetch,WebSearch,Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git reset:*)"

      # Claude pushes with the GitHub App / GITHUB_TOKEN, which doesn't trigger CI.
      # workflow_dispatch is the documented exception, so dispatch ci.yml on the branch.
      # All event data reaches the script through env vars, never inline expressions.
      - name: Re-run CI on the pushed branch
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          set -euo pipefail
          ref=""
          head_repo="$REPO"
          case "$EVENT_NAME" in
            pull_request_review|pull_request_review_comment)
              ref="$PR_HEAD_REF"; head_repo="$PR_HEAD_REPO" ;;
            issue_comment)
              if [ "$ISSUE_IS_PR" = "true" ]; then
                [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad issue number"; exit 1; }
                ref=$(gh api "repos/$REPO/pulls/$ISSUE_NUMBER" --jq .head.ref)
                head_repo=$(gh api "repos/$REPO/pulls/$ISSUE_NUMBER" --jq .head.repo.full_name)
              elif [[ "$CLAUDE_BRANCH" == claude/* ]]; then
                ref="$CLAUDE_BRANCH"
              fi ;;
            issues)
              if [[ "$CLAUDE_BRANCH" == claude/* ]]; then ref="$CLAUDE_BRANCH"; fi ;;
          esac
          if [ -z "$ref" ]; then
            echo "No PR or claude/* branch for this event; nothing to dispatch."
            exit 0
          fi
          if [ "$head_repo" != "$REPO" ]; then
            echo "Head branch is in $head_repo (fork); not dispatching."
            exit 0
          fi
          if ! [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$ref" == -* ]]; then
            echo "::error::Refusing unexpected branch name"; exit 1
          fi
          if ! gh api "repos/$REPO/branches/$ref" --silent 2>/dev/null; then
            echo "Branch $ref doesn't exist on $REPO (Claude pushed nothing); nothing to dispatch."
            exit 0
          fi
          gh workflow run ci.yml --repo "$REPO" --ref "$ref"
          echo "Dispatched ci.yml on $ref"
